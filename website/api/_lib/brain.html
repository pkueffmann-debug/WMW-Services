<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS · Neural Interface</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin />
<style>
  :root {
    --cyan: #00DCFF;
    --cyan-soft: rgba(0, 220, 255, 0.55);
    --cyan-dim: rgba(0, 220, 255, 0.18);
    --bright: #B7ECFF;
    --orange: #FF7A1F;
    --bg: #000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--cyan); overflow: hidden;
    font-family: "SF Mono", "JetBrains Mono", Menlo, monospace; }

  #brain-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Center status */
  #status {
    position: fixed; left: 50%; bottom: 38px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 4px; color: var(--cyan-soft);
    text-transform: uppercase;
    z-index: 5;
  }
  #status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--cyan); vertical-align: middle; margin-right: 8px;
    box-shadow: 0 0 12px var(--cyan);
  }
  #status.idle .dot       { background: #4682B4; box-shadow: 0 0 6px #4682B4; }
  #status.listening .dot  { background: #00FF88; box-shadow: 0 0 12px #00FF88; animation: pulse 1s infinite; }
  #status.speaking .dot   { background: #FFC83A; box-shadow: 0 0 12px #FFC83A; animation: pulse 0.4s infinite; }
  #status.thinking .dot   { background: var(--orange); box-shadow: 0 0 12px var(--orange); animation: pulse 0.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  /* JARVIS circular badge bottom-right */
  #jarvis-badge {
    position: fixed; right: 28px; bottom: 28px; width: 64px; height: 64px;
    border-radius: 50%; border: 1px solid var(--cyan-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--bright); font-size: 10px; font-weight: 700;
    letter-spacing: 2px;
    background: rgba(0, 30, 50, 0.4);
    box-shadow: 0 0 20px rgba(0,220,255,0.25), inset 0 0 12px rgba(0,220,255,0.15);
    z-index: 5; cursor: pointer; user-select: none;
  }
  #jarvis-badge::before {
    content: ''; position: absolute; inset: 4px; border-radius: 50%;
    border: 1px solid var(--cyan-dim);
    animation: spin 12s linear infinite;
  }
  #jarvis-badge::after {
    content: ''; position: absolute; left: 50%; top: 4px; width: 2px; height: 10px;
    background: var(--orange); transform-origin: center 28px;
    animation: spin 4s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }

  /* Hint text top-left */
  #hint {
    position: fixed; top: 24px; left: 24px; font-size: 11px; letter-spacing: 2px;
    color: var(--cyan-soft); text-transform: uppercase;
    z-index: 5;
  }
  #hint b { color: var(--bright); font-weight: 600; }

  /* Mic button (toggle) */
  #mic-btn, #ultra-btn, #hand-btn {
    position: fixed; top: 24px; padding: 8px 16px;
    background: rgba(0, 30, 50, 0.5); color: var(--bright);
    border: 1px solid var(--cyan-soft); border-radius: 99px;
    font-family: inherit; font-size: 11px; letter-spacing: 2px;
    cursor: pointer; z-index: 5;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.3s;
  }
  #mic-btn { right: 24px; }
  #ultra-btn { right: 168px; }
  #hand-btn { right: 312px; }
  #mic-btn:hover, #ultra-btn:hover, #hand-btn:hover { background: rgba(0, 60, 90, 0.7); }
  #hand-btn.active {
    background: rgba(0, 60, 90, 0.85);
    border-color: var(--bright);
  }

  /* Webcam preview, top-left, lazily shown when hand tracking is on */
  #hand-cam {
    position: fixed;
    top: 80px; left: 24px;
    width: 180px; height: 135px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid var(--cyan-soft);
    border-radius: 12px;
    z-index: 8;
    overflow: hidden;
    display: none;
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45), 0 0 24px rgba(34, 211, 238, 0.12);
  }
  #hand-cam.active { display: block; }
  #hand-cam video, #hand-cam canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);   /* mirror so it feels like a mirror */
  }
  #hand-cam canvas { pointer-events: none; }
  #hand-label {
    position: absolute;
    bottom: 6px; left: 6px; right: 6px;
    background: rgba(0, 0, 0, 0.65);
    color: var(--bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 4px 6px;
    border-radius: 6px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  #hand-cam.fired { animation: hand-flash 0.4s ease-out; }
  @keyframes hand-flash {
    0%   { box-shadow: 0 18px 36px rgba(0,0,0,0.45), 0 0 0 4px rgba(34,211,238,0.8); }
    100% { box-shadow: 0 18px 36px rgba(0,0,0,0.45), 0 0 0 0 rgba(34,211,238,0); }
  }
  /* Active recording: cyan border + outward-pulse glow so the user
     can see at a glance that JARVIS is currently listening. */
  #mic-btn.recording {
    background: rgba(0, 60, 90, 0.85);
    border-color: var(--bright);
    color: var(--bright);
    animation: mic-pulse 1.6s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.55), 0 0 14px rgba(34, 211, 238, 0.45); }
    50%      { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0),     0 0 22px rgba(34, 211, 238, 0.65); }
  }
  body.ultra #ultra-btn {
    background: linear-gradient(90deg, rgba(255,122,31,0.8), rgba(255,200,90,0.8));
    color: #000; border-color: #FFC83A;
    box-shadow: 0 0 20px rgba(255,200,90,0.5);
  }
  /* Pulse the brain glow stronger when ultra mode is on */
  body.ultra { box-shadow: inset 0 0 80px rgba(255,200,90,0.06); }

  /* Chat overlay */
  #chat-pane {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
    z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.35s;
  }
  #chat-pane.open { opacity: 1; pointer-events: auto; }
  .chat-box {
    width: min(720px, 92vw); height: min(620px, 84vh);
    background: rgba(0, 14, 24, 0.95); border: 1px solid var(--cyan-soft);
    border-radius: 14px; padding: 22px;
    box-shadow: 0 0 40px rgba(0, 220, 255, 0.15);
    display: flex; flex-direction: column;
  }
  .chat-box h2 { font-size: 12px; letter-spacing: 4px; color: var(--bright); margin-bottom: 12px; }
  .chat-box .messages { flex: 1; overflow-y: auto; margin: 8px 0; padding-right: 8px; }
  .chat-box .messages::-webkit-scrollbar { width: 4px; }
  .chat-box .messages::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }
  .msg { padding: 10px 14px; margin: 6px 0; border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; color: #d8efff; }
  .msg.user { background: rgba(0, 220, 255, 0.10); border: 1px solid var(--cyan-dim);
    margin-left: 64px; }
  .msg.bot { background: rgba(120, 235, 255, 0.05); border: 1px solid rgba(120, 235, 255, 0.15);
    margin-right: 64px; color: var(--bright); }
  .msg .msg-text { white-space: pre-wrap; }
  .code-panel {
    margin: 10px 0 6px;
    border: 1px solid rgba(34, 211, 238, 0.22);
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }
  .code-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: rgba(34, 211, 238, 0.06);
    border-bottom: 1px solid rgba(34, 211, 238, 0.14);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  }
  .code-head .lang { color: var(--cyan); font-weight: 600; }
  .code-head .code-actions { display: flex; gap: 6px; }
  .code-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--bright);
    background: transparent;
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-radius: 99px;
    padding: 5px 11px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .code-btn:hover { background: rgba(34, 211, 238, 0.12); border-color: var(--cyan); }
  .code-btn.run { color: #050; border-color: rgba(74, 222, 128, 0.55); background: rgba(74, 222, 128, 0.15); color: #c5fdd9; }
  .code-btn.run:hover { background: rgba(74, 222, 128, 0.25); }
  .code-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .code-body {
    margin: 0; padding: 12px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; line-height: 1.55;
    color: #d8efff;
    background: rgba(0, 0, 0, 0.4);
    overflow-x: auto;
    white-space: pre;
    border-bottom: 1px solid rgba(34, 211, 238, 0.10);
  }
  .code-output {
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; line-height: 1.55;
    color: var(--dim);
    white-space: pre-wrap;
    border-top: 1px solid rgba(34, 211, 238, 0.10);
    background: rgba(0, 0, 0, 0.5);
  }
  .code-output.running { color: var(--cyan); }
  .code-output.ok      { color: #c5fdd9; }
  .code-output.err     { color: #fca5a5; background: rgba(239, 68, 68, 0.06); }
  .chat-box .input-row { display: flex; gap: 8px; margin-top: 8px; }
  .chat-box input {
    flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--cyan-soft);
    color: var(--bright); font-family: 'Inter', sans-serif; font-size: 14px;
    padding: 12px 14px; border-radius: 10px; outline: none;
  }
  .chat-box input:focus { border-color: var(--bright); }
  .chat-box button {
    background: var(--cyan); color: #001020; border: none;
    padding: 0 16px; border-radius: 10px; font-family: inherit; font-size: 12px;
    letter-spacing: 1px; cursor: pointer; font-weight: 700;
  }
  .chat-close, .map-close {
    position: absolute; top: 16px; right: 20px; width: 30px; height: 30px;
    background: rgba(0, 30, 50, 0.5); border: 1px solid var(--cyan-soft);
    color: var(--bright); border-radius: 50%; cursor: pointer;
    font-family: inherit; font-size: 16px; z-index: 30;
  }

  /* Map overlay */
  #map-pane {
    position: fixed; inset: 0; z-index: 15;
    opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  #map-pane.open { opacity: 1; pointer-events: auto; }
  #map { width: 100%; height: 100%; background: #000; }
  .leaflet-container { background: #000 !important; }
  .leaflet-control-attribution { display: none; }
  #map-label {
    position: absolute; top: 30px; left: 30px; z-index: 30;
    font-size: 14px; letter-spacing: 3px; color: var(--bright);
    background: rgba(0, 14, 24, 0.85); border: 1px solid var(--cyan-soft);
    padding: 10px 18px; border-radius: 99px;
    text-transform: uppercase;
    box-shadow: 0 0 14px rgba(0, 220, 255, 0.2);
  }
  #map-label .accent { color: var(--orange); }

  @keyframes pulse-marker {
    0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(0, 220, 255, 0.7) }
    100% { transform: scale(1.6); opacity: 0; box-shadow: 0 0 0 18px rgba(0, 220, 255, 0) }
  }
  .pulse-marker {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--cyan); border: 2px solid #fff;
    box-shadow: 0 0 16px var(--cyan);
    position: relative;
  }
  .pulse-marker::before {
    content: ''; position: absolute; inset: -4px;
    border-radius: 50%; background: rgba(0, 220, 255, 0.5);
    animation: pulse-marker 1.6s infinite;
  }

  /* Desktop-bridge status badge (top-right, above ULTRA + ENABLE VOICE) */
  #desktop-badge {
    position: fixed;
    top: 24px; right: 24px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    background: rgba(0, 30, 50, 0.55);
    border: 1px solid var(--cyan-soft);
    border-radius: 99px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bright);
    cursor: pointer;
    z-index: 6;
    transition: background 0.2s, border-color 0.2s;
  }
  #desktop-badge:hover { background: rgba(0, 60, 90, 0.7); }
  #desktop-badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #6b7280;
    transition: background 0.3s, box-shadow 0.3s;
  }
  #desktop-badge.connected .dot {
    background: #22c55e;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
  }
  #desktop-badge.connecting .dot {
    background: #f59e0b;
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    animation: pulse 1.2s ease-in-out infinite;
  }

  /* Hide the badge from blocking the existing mic/ultra row by stacking */
  /* mic-btn is at top: 24px, right: 24px — push it left when badge present */
  body.has-desktop-badge #mic-btn { right: 24px; top: 60px; }
  body.has-desktop-badge #ultra-btn { right: 168px; top: 60px; }
  body.has-desktop-badge #hand-btn { right: 312px; top: 60px; }

  /* Feature availability popover */
  #desktop-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #desktop-modal.open { display: flex; }
  #desktop-modal-card {
    background: rgba(8, 16, 22, 0.96);
    border: 1px solid var(--cyan-soft);
    border-radius: 14px;
    padding: 28px 28px 22px;
    max-width: 460px; width: 100%;
    color: var(--bright);
    font-family: inherit;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6), 0 0 40px rgba(0, 220, 255, 0.1);
  }
  #desktop-modal h2 {
    font-size: 14px;
    letter-spacing: 0.2em;
    color: var(--cyan);
    margin: 0 0 14px;
    text-transform: uppercase;
  }
  #desktop-modal p { font-size: 13px; line-height: 1.6; margin-bottom: 18px; color: #a0c8da; }
  #desktop-modal ul { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 8px; }
  #desktop-modal li {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--bright);
  }
  #desktop-modal li .ic { font-weight: 700; width: 16px; text-align: center; }
  #desktop-modal li .ic.on  { color: #22c55e; }
  #desktop-modal li .ic.off { color: #6b7280; }
  #desktop-modal .download-row {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(0, 220, 255, 0.15);
    font-size: 12px; color: #7aa2b8;
  }
  #desktop-modal .download-row a { color: var(--cyan); }
  #desktop-modal-close {
    background: transparent; border: 1px solid var(--cyan-soft); color: var(--bright);
    padding: 8px 18px; border-radius: 99px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.16em;
    cursor: pointer; text-transform: uppercase;
    margin-top: 4px;
  }
  #desktop-modal-close:hover { background: rgba(0, 60, 90, 0.5); }
</style>
</head>
<body>
  <canvas id="brain-canvas"></canvas>

  <div id="hint">
    <b>OPEN</b> YOUTUBE · <b>MAP OF</b> LONDON · <b>ASK GEMINI</b> X · <b>ULTRA MODE</b> · <b>REMEMBER</b> X
  </div>
  <div id="desktop-badge" class="disconnected" title="Klicken für Details">
    <span class="dot"></span>
    <span id="desktop-badge-text">Nur Browser-Modus</span>
  </div>
  <button id="hand-btn">✋ HAND</button>
  <button id="ultra-btn">◌ ULTRA MODE</button>
  <button id="mic-btn">◉ ENABLE VOICE</button>
  <div id="hand-cam">
    <video id="hand-video" playsinline muted></video>
    <canvas id="hand-canvas"></canvas>
    <div id="hand-label">—</div>
  </div>
  <div id="status" class="idle"><span class="dot"></span><span id="status-text">STANDBY</span></div>
  <div id="jarvis-badge">JARVIS</div>

  <div id="desktop-modal">
    <div id="desktop-modal-card">
      <h2 id="desktop-modal-title">Desktop-Verbindung</h2>
      <p id="desktop-modal-body"></p>
      <ul id="desktop-feature-list"></ul>
      <div class="download-row" id="desktop-modal-download" style="display:none;">
        Desktop-App noch nicht installiert? Lade sie unter
        <a href="/#pricing" target="_blank">daylens.dev</a> herunter.
      </div>
      <button id="desktop-modal-close">Schließen</button>
    </div>
  </div>

  <div id="chat-pane">
    <div class="chat-box">
      <button class="chat-close" data-close="chat">×</button>
      <h2>J.A.R.V.I.S · CHAT</h2>
      <div class="messages" id="messages">
        <div class="msg bot">Guten Tag, Sir. Wie kann ich Ihnen behilflich sein?</div>
      </div>
      <form id="chat-form" class="input-row">
        <input id="chat-input" placeholder="Frag JARVIS etwas..." autocomplete="off" />
        <button type="submit">SEND</button>
      </form>
    </div>
  </div>

  <div id="map-pane">
    <button class="map-close" data-close="map">×</button>
    <div id="map-label"><span id="map-city">LONDON</span></div>
    <div id="map"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<script>
// ── Brain canvas ────────────────────────────────────────────────────────
(function () {
  const canvas = document.getElementById('brain-canvas');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  // Brain-shaped 3D point cloud + edges
  // Procedural "brain blob": elongated ellipsoid + lobe bumps
  function brainPoint() {
    const u = Math.random() * Math.PI * 2;
    const v = Math.acos(2 * Math.random() - 1);
    // Brain proportions: longer X (front-back), narrower Y (top-bottom-ish), depth Z
    let x = Math.sin(v) * Math.cos(u) * 1.45;
    let y = Math.cos(v)             * 0.85;
    let z = Math.sin(v) * Math.sin(u) * 1.10;
    // Lobe bumps — cosine variation along surface
    const lobe = 0.10 * Math.sin(u * 5) * Math.cos(v * 3);
    x *= (1 + lobe); y *= (1 + lobe); z *= (1 + lobe);
    // Add a tiny radial jitter to avoid perfect smoothness
    const jitter = 1 + (Math.random() - 0.5) * 0.04;
    return { x: x * jitter, y: y * jitter, z: z * jitter };
  }

  const POINTS = [];
  const POINT_COUNT = 520;
  for (let i = 0; i < POINT_COUNT; i++) POINTS.push(brainPoint());

  // Build edges — each point connects to its 3 nearest neighbours
  const EDGES = [];
  const K = 3;
  for (let i = 0; i < POINTS.length; i++) {
    const d = [];
    for (let j = 0; j < POINTS.length; j++) {
      if (i === j) continue;
      const dx = POINTS[i].x - POINTS[j].x;
      const dy = POINTS[i].y - POINTS[j].y;
      const dz = POINTS[i].z - POINTS[j].z;
      d.push([dx*dx + dy*dy + dz*dz, j]);
    }
    d.sort((a, b) => a[0] - b[0]);
    for (let k = 0; k < K; k++) {
      const j = d[k][1];
      if (j > i) EDGES.push([i, j]);
    }
  }

  // Extra "wireframe" points — a few hundred farther out
  const OUTER = [];
  for (let i = 0; i < 80; i++) {
    const p = brainPoint();
    const sc = 1.25 + Math.random() * 0.5;
    OUTER.push({ x: p.x * sc, y: p.y * sc, z: p.z * sc });
  }
  const OUTER_EDGES = [];
  for (let i = 0; i < OUTER.length; i++) {
    const d = [];
    for (let j = 0; j < OUTER.length; j++) {
      if (i === j) continue;
      const dx = OUTER[i].x - OUTER[j].x;
      const dy = OUTER[i].y - OUTER[j].y;
      const dz = OUTER[i].z - OUTER[j].z;
      d.push([dx*dx + dy*dy + dz*dz, j]);
    }
    d.sort((a, b) => a[0] - b[0]);
    for (let k = 0; k < 4; k++) {
      const j = d[k][1];
      if (j > i) OUTER_EDGES.push([i, j]);
    }
  }

  // Pulses: a glowing white line that draws itself along one edge of the
  // brain's network (like a neuron firing). Once it reaches the far end it
  // can chain into a connected edge, creating signal cascades. After the
  // pulse completes it fades out. Brain structure stays untouched.
  const pulses = [];
  const MAX_PULSES = 90;
  const PULSE_GROW_MS = 480;
  const PULSE_FADE_MS = 520;

  // For chaining: precompute adjacency (which edges share each point)
  function buildAdjacency(pointsLen, edges) {
    const adj = Array.from({ length: pointsLen }, () => []);
    for (let k = 0; k < edges.length; k++) {
      const [i, j] = edges[k];
      adj[i].push(j);
      adj[j].push(i);
    }
    return adj;
  }
  let INNER_ADJ = null;   // built lazily after POINTS/EDGES exist

  function spawnPulse(t, opts = {}) {
    if (pulses.length > MAX_PULSES) return;
    const useOuter = opts.useOuter ?? (Math.random() < 0.25);
    const list = useOuter ? OUTER_EDGES : EDGES;
    const points = useOuter ? OUTER : POINTS;
    if (!list.length) return;
    let aIdx, bIdx;
    if (opts.startIdx !== undefined && !useOuter && INNER_ADJ) {
      // Continue a chain — pick a neighbour of startIdx
      const neighbours = INNER_ADJ[opts.startIdx];
      if (!neighbours || !neighbours.length) return;
      aIdx = opts.startIdx;
      bIdx = neighbours[Math.floor(Math.random() * neighbours.length)];
    } else {
      const [i, j] = list[Math.floor(Math.random() * list.length)];
      aIdx = i; bIdx = j;
    }
    pulses.push({
      a: points[aIdx], b: points[bIdx],
      aIdx, bIdx,
      bornAt: t,
      isOuter: useOuter,
      chainDepth: opts.chainDepth || 0,
      didChain: false,
    });
  }

  let yaw = 0;
  let lastT = performance.now();

  function getMode() { return window._jarvisMode || 'idle'; }
  function getSpeed() {
    const m = getMode();
    if (m === 'speaking') return 0.35;
    if (m === 'listening') return 0.22;
    if (m === 'thinking') return 0.55;
    return 0.10;
  }
  function getTint() {
    const m = getMode();
    if (m === 'listening') return [80, 255, 170];
    if (m === 'speaking')  return [255, 200, 90];
    if (m === 'thinking')  return [255, 130, 60];
    return [80, 200, 255];
  }
  function getPulse(t) {
    const m = getMode();
    if (m === 'speaking') return 0.85 + 0.15 * Math.abs(Math.sin(t / 180));
    if (m === 'listening') return 0.9 + 0.1 * Math.sin(t / 500);
    if (m === 'thinking') return 0.7 + 0.3 * Math.random();
    return 0.95 + 0.05 * Math.sin(t / 1200);
  }

  function rotate3D(p, cy, sy, cp, sp) {
    const xz =  p.x * cy + p.z * sy;
    const zz = -p.x * sy + p.z * cy;
    const y2 = p.y * cp - zz * sp;
    const z2 = p.y * sp + zz * cp;
    return [xz, y2, z2];
  }

  function draw(t) {
    const dt = t - lastT; lastT = t;
    yaw += (dt / 1000) * getSpeed();
    const pitch = Math.sin(t / 6000) * 0.18;
    const cy = Math.cos(yaw),   sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cyy = canvas.height / 2;
    const R = Math.min(canvas.width, canvas.height) * 0.28;

    const tint = getTint();
    const pulse = getPulse(t);

    function project(p) {
      const [x, y, z] = rotate3D(p, cy, sy, cp, sp);
      const persp = 1 / (1.6 - z * 0.5);
      return [cx + x * R * persp, cyy + y * R * persp, z, persp];
    }

    // Pre-project all points
    const projI = POINTS.map(project);
    const projO = OUTER.map(project);

    // Halo
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const haloR = R * 1.4 * pulse;
    const halo = ctx.createRadialGradient(cx, cyy, R * 0.5, cx, cyy, haloR);
    halo.addColorStop(0, `rgba(${tint[0]}, ${tint[1]}, ${tint[2]}, ${0.18 * pulse})`);
    halo.addColorStop(1, `rgba(${tint[0]}, ${tint[1]}, ${tint[2]}, 0)`);
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cyy, haloR, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // Outer wireframe edges (faint)
    ctx.lineWidth = 1 * devicePixelRatio;
    for (const [i, j] of OUTER_EDGES) {
      const a = projO[i], b = projO[j];
      const depth = (a[2] + b[2]) / 4 + 0.5; // 0..1
      const alpha = 0.06 + 0.15 * depth;
      ctx.strokeStyle = `rgba(${tint[0]}, ${tint[1]}, ${tint[2]}, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
    // Outer wireframe dots
    for (const p of projO) {
      const depth = (p[2] + 1) / 2;
      ctx.fillStyle = `rgba(220, 240, 255, ${0.25 + 0.5 * depth})`;
      ctx.beginPath();
      ctx.arc(p[0], p[1], 1.6 * devicePixelRatio * p[3], 0, Math.PI * 2);
      ctx.fill();
    }

    // Inner brain edges (denser, fainter)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 0.8 * devicePixelRatio;
    for (const [i, j] of EDGES) {
      const a = projI[i], b = projI[j];
      const depth = (a[2] + b[2]) / 4 + 0.5;
      const alpha = (0.05 + 0.22 * depth) * pulse;
      ctx.strokeStyle = `rgba(${tint[0]}, ${tint[1]}, ${tint[2]}, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }

    // Inner points
    for (let i = 0; i < projI.length; i++) {
      const p = projI[i];
      const depth = (p[2] + 1) / 2;
      const twink = 0.5 + 0.5 * Math.sin(t * 0.001 * (1 + i % 7) + i);
      const a = (0.4 + 0.6 * depth) * (0.5 + 0.5 * twink) * pulse;
      ctx.fillStyle = `rgba(${Math.min(255, tint[0]+60)}, ${Math.min(255, tint[1]+30)}, 255, ${a})`;
      ctx.beginPath();
      ctx.arc(p[0], p[1], (1.2 + 1.4 * depth) * devicePixelRatio * p[3], 0, Math.PI * 2);
      ctx.fill();
    }

    // ── Pulses: glowing lines that extend along edges, then dissolve ─
    const mode = getMode();
    if (!INNER_ADJ) INNER_ADJ = buildAdjacency(POINTS.length, EDGES);

    const spawnPerFrame =
      mode === 'speaking'  ? 1.6 :
      mode === 'thinking'  ? 1.2 :
      mode === 'listening' ? 0.8 : 0.5;
    let toSpawn = Math.floor(spawnPerFrame) + (Math.random() < (spawnPerFrame % 1) ? 1 : 0);
    while (toSpawn-- > 0) spawnPulse(t);

    // Project + render pulses
    ctx.lineWidth = 1.6 * devicePixelRatio;
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      const age = t - p.bornAt;
      const total = PULSE_GROW_MS + PULSE_FADE_MS;
      if (age >= total) { pulses.splice(i, 1); continue; }

      const grow = Math.min(1, age / PULSE_GROW_MS);
      const fade = age > PULSE_GROW_MS ? (age - PULSE_GROW_MS) / PULSE_FADE_MS : 0;

      // Chain when growth completes: spawn a new pulse from b → neighbour
      if (!p.didChain && grow >= 1 && !p.isOuter && p.chainDepth < 3 && Math.random() < 0.6) {
        spawnPulse(t, { startIdx: p.bIdx, chainDepth: p.chainDepth + 1 });
        p.didChain = true;
      }

      // Project endpoints with current rotation
      const [ax, ay, az] = rotate3D(p.a, cy, sy, cp, sp);
      const [bx, by, bz] = rotate3D(p.b, cy, sy, cp, sp);
      const ap = 1 / (1.6 - az * 0.5);
      const bp = 1 / (1.6 - bz * 0.5);
      const A = [cx + ax * R * ap, cyy + ay * R * ap];
      const B = [cx + bx * R * bp, cyy + by * R * bp];

      // The "head" of the pulse — how far we've drawn from A toward B
      const Hx = A[0] + (B[0] - A[0]) * grow;
      const Hy = A[1] + (B[1] - A[1]) * grow;

      const depth = ((az + bz) / 2 + 1) / 2;
      // Brightness: brightest while growing, then linear fade
      const alpha = (1 - fade) * (0.6 + 0.4 * depth) * pulse;

      // Glow halo line (thick, soft)
      ctx.strokeStyle = `rgba(${Math.min(255, tint[0]+80)}, ${Math.min(255, tint[1]+50)}, 255, ${alpha * 0.45})`;
      ctx.lineWidth = 3.5 * devicePixelRatio;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(A[0], A[1]); ctx.lineTo(Hx, Hy);
      ctx.stroke();

      // Hot core line (thin white)
      ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.95})`;
      ctx.lineWidth = 1.4 * devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(A[0], A[1]); ctx.lineTo(Hx, Hy);
      ctx.stroke();
      ctx.lineCap = 'butt';

      // Bright head dot while growing
      if (grow < 1) {
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(Hx, Hy, 3 * devicePixelRatio, 0, Math.PI * 2);
        ctx.fill();
        // Soft halo around the head
        ctx.fillStyle = `rgba(${Math.min(255, tint[0]+100)}, ${Math.min(255, tint[1]+60)}, 255, ${alpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(Hx, Hy, 7 * devicePixelRatio, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();


// ── State ──────────────────────────────────────────────────────────────
const $status = document.getElementById('status');
const $statusText = document.getElementById('status-text');
function setMode(mode, text) {
  window._jarvisMode = mode;
  $status.className = mode;
  $statusText.textContent = text || mode.toUpperCase();
}
setMode('idle', 'STANDBY');


// ── Morning briefing ───────────────────────────────────────────────────
// Once a day in the 8–11 window (or forced via ?briefing=test) JARVIS
// reads the top RSS headlines aloud. The briefing text is also pushed
// into the chat history so "mehr dazu" / follow-ups have context.
const BRIEFING_KEY  = 'jarvisLastBriefedDate';
const FORCE_TEST    = new URLSearchParams(location.search).get('briefing') === 'test';

async function morningBriefing() {
  setMode('thinking', 'NEWS');
  try {
    const r = await fetch('/api/brain/news');
    if (!r.ok) throw new Error('news ' + r.status);
    const j = await r.json();
    if (!Array.isArray(j.items) || !j.items.length) {
      addMessage('bot', 'Konnte keine Nachrichten laden, Sir.');
      setMode('idle', 'STANDBY');
      return;
    }

    const hour = new Date().getHours();
    const hi   = hour < 11 ? 'Guten Morgen Paul' : hour < 18 ? 'Guten Tag Paul' : 'Guten Abend Paul';
    const lines = j.items.map((it, i) => `${i + 1}. ${it.title}`).join('. ');
    const intro = `${hi}. Hier sind die Top-Nachrichten von heute. ${lines}. Sagen Sie "mehr dazu", wenn ich auf eine eingehen soll.`;

    // Put the full structured briefing in chat history so Claude can
    // expand on individual items when the user asks "mehr dazu zu Punkt 2".
    const fullContext = intro + '\n\nQuellen:\n' + j.items
      .map((it, i) => `${i + 1}. [${it.source}] ${it.title} — ${it.description}`)
      .join('\n');

    _chatHistory.push({ role: 'user',      content: 'Lies mir die Nachrichten von heute vor.' });
    _chatHistory.push({ role: 'assistant', content: fullContext });

    addMessage('bot', intro);
    setMode('speaking', 'SPEAKING');
    await speak(intro);
  } catch (e) {
    console.error('[briefing]', e);
    addMessage('bot', 'Die Nachrichten sind im Moment nicht erreichbar, Sir.');
  } finally {
    setMode('idle', 'STANDBY');
  }
}

function checkMorningBriefing() {
  if (FORCE_TEST) {
    // Honour the manual override once per page load, then strip the
    // query param so a refresh doesn't trigger again.
    if (!window._briefingFired) {
      window._briefingFired = true;
      const u = new URL(location.href);
      u.searchParams.delete('briefing');
      history.replaceState({}, '', u.toString());
      morningBriefing();
    }
    return;
  }
  const now   = new Date();
  const hour  = now.getHours();
  const today = now.toISOString().slice(0, 10);
  if (hour < 8 || hour >= 11) return;
  if (localStorage.getItem(BRIEFING_KEY) === today) return;
  localStorage.setItem(BRIEFING_KEY, today);
  morningBriefing();
}

// Kick the check 3 s after page load (lets stars, neural net, status
// indicator settle) and again every minute so the briefing fires even
// when the user has the tab open as the clock crosses 8:00.
window.addEventListener('load', () => setTimeout(checkMorningBriefing, 3000));
setInterval(checkMorningBriefing, 60_000);


// ── Idle proactivity ───────────────────────────────────────────────────
// If the user has voice on and goes silent for IDLE_TIMEOUT, JARVIS
// pings once: "Sir? Anything I can help with?". We rotate phrasings
// so it doesn't feel scripted, and we wait a long gap between pings
// so it never feels like nagging.
const IDLE_TIMEOUT_MS    = 5 * 60 * 1000;   // 5 min of silence
const IDLE_GAP_MIN_MS    = 8 * 60 * 1000;   // never less than 8 min between pings
const IDLE_PROMPTS = [
  'Sir? Etwas, womit ich helfen kann?',
  'Sir, brauchen Sie etwas?',
  'Ich stehe bereit, falls Sie etwas benötigen, Sir.',
  'Soll ich irgendwo nachhelfen, Sir?',
  'Stille Wasser, Sir. Etwas im Sinn?',
];
let _lastUserActivity = Date.now();
let _lastIdlePromptAt = 0;
let _idlePromptIdx    = 0;

function markUserActive() { _lastUserActivity = Date.now(); }
// Bind to anything that proves the user is around.
window.addEventListener('mousemove', markUserActive, { passive: true });
window.addEventListener('keydown',   markUserActive);
window.addEventListener('click',     markUserActive);
window.addEventListener('touchstart',markUserActive, { passive: true });

async function checkIdle() {
  // Only nudge when:
  //  - voice loop is active (user is actually using JARVIS),
  //  - no chat request is in flight,
  //  - not currently listening (avoid talking over the mic),
  //  - briefing wasn't running (would conflict),
  //  - we haven't pinged in the last IDLE_GAP_MIN_MS.
  if (typeof window._wantsVoice === 'undefined' || !window._wantsVoice) return;
  if (typeof _chatPending !== 'undefined' && _chatPending) return;
  const $statusEl = document.getElementById('status');
  if ($statusEl?.classList.contains('listening') || $statusEl?.classList.contains('speaking') || $statusEl?.classList.contains('thinking')) return;
  const now = Date.now();
  if (now - _lastUserActivity < IDLE_TIMEOUT_MS) return;
  if (now - _lastIdlePromptAt < IDLE_GAP_MIN_MS) return;

  _lastIdlePromptAt = now;
  const line = IDLE_PROMPTS[_idlePromptIdx % IDLE_PROMPTS.length];
  _idlePromptIdx++;
  try {
    addMessage('bot', line);
    setMode('speaking', 'SPEAKING');
    await speak(line);
  } catch (e) {
    console.warn('[idle-prompt]', e?.message);
  } finally {
    setMode('idle', 'STANDBY');
    // Reset activity so the next ping waits the full IDLE_TIMEOUT_MS
    _lastUserActivity = Date.now();
  }
}
setInterval(checkIdle, 30_000);


// ── Chat ───────────────────────────────────────────────────────────────
const $chatPane = document.getElementById('chat-pane');
const $messages = document.getElementById('messages');
const $chatForm = document.getElementById('chat-form');
const $chatInput = document.getElementById('chat-input');

function openChat() { $chatPane.classList.add('open'); setTimeout(() => $chatInput.focus(), 200); }
function closeChat() { $chatPane.classList.remove('open'); }

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  $messages.appendChild(div);
  $messages.scrollTop = $messages.scrollHeight;
}

const _chatHistory = [];   // role/content pairs for the chat endpoint
let _lastUrl = null;       // last URL JARVIS mentioned — used by "open the link"
let _ultraMode = false;    // true → /api/brain/debate (3 AIs + critic + synthesizer)
let _explicitProvider = null;  // 'openai' | 'gemini' | 'groq' | 'mistral' | null

function rememberUrlsFrom(text) {
  // Pull the LAST URL out of a Claude reply so "open the link" works.
  const m = [...text.matchAll(/https?:\/\/[^\s<>()"']+/gi)];
  if (m.length) _lastUrl = m[m.length - 1][0];
}

// Voice-URL normalisation: "google dot com" → "google.com" etc.
function normaliseSpokenUrl(s) {
  return s.toLowerCase()
    .replace(/\s+dot\s+/g, '.')
    .replace(/\s+punkt\s+/g, '.')
    .replace(/\s+slash\s+/g, '/')
    .replace(/\s+schrägstrich\s+/g, '/')
    .replace(/\s+colon\s+/g, ':')
    .replace(/\s+doppelpunkt\s+/g, ':')
    .replace(/\s+at\s+/g, '@')
    .replace(/\s+plus\s+/g, '+')
    .replace(/\s+strich\s+/g, '-')
    .replace(/\s+dash\s+/g, '-')
    .replace(/\s+underscore\s+/g, '_')
    .replace(/\s+unterstrich\s+/g, '_')
    .replace(/\s+/g, ' ')         // collapse remaining spaces
    .trim();
}

let _chatPending = false;  // double-submit guard

// Fetch with 30s AbortController timeout + 1 retry on 5xx/network errors.
async function fetchWithRetry(endpoint, payload, { timeoutMs = 30000, retries = 1 } = {}) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctrl.signal,
      });
      clearTimeout(tid);
      // Retry only on 5xx server errors, not 4xx (those are auth / payment / validation).
      if (r.status >= 500 && r.status < 600 && attempt < retries) {
        console.warn(`[askJarvis] ${endpoint} → HTTP ${r.status}, retrying (${attempt + 1}/${retries})…`);
        await new Promise(rs => setTimeout(rs, 1000));
        continue;
      }
      return r;
    } catch (e) {
      clearTimeout(tid);
      const isAbort = e.name === 'AbortError';
      console.warn(`[askJarvis] ${endpoint} ${isAbort ? 'TIMEOUT' : 'NETWORK'}: ${e.message}`);
      if (attempt < retries) {
        await new Promise(rs => setTimeout(rs, 1000));
        continue;
      }
      throw e;
    }
  }
}

// Append to an existing bot bubble (used during streaming). If the bubble
// doesn't exist yet, create it.
function createBotBubble() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.textContent = '';
  $messages.appendChild(div);
  $messages.scrollTop = $messages.scrollHeight;
  return div;
}

async function askJarvis(text) {
  if (_chatPending) {
    console.warn('[askJarvis] already pending, ignoring duplicate send');
    return;
  }
  if (typeof markUserActive === 'function') markUserActive();
  _chatPending = true;
  $chatInput.disabled = true;
  addMessage('user', text);
  setMode('thinking', _ultraMode ? 'ULTRA · 3 AIs' : 'PROCESSING');
  _chatHistory.push({ role: 'user', content: text });

  let reply = '';
  let debate = null;
  let actions = [];
  let bubble = null;

  try {
    const endpoint = _ultraMode ? '/api/brain/debate' : '/api/brain/chat';
    const payload = {
      messages: _chatHistory.slice(-4),
      desktop_connected: desktop.isConnected(),
    };
    if (_explicitProvider) { payload.provider = _explicitProvider; _explicitProvider = null; }
    const r = await fetchWithRetry(endpoint, payload);

    if (r.status === 401) {
      reply = 'Sitzung abgelaufen, Sir — bitte erneut anmelden.';
      setTimeout(() => { window.location.href = '/auth.html?next=/brain'; }, 1500);
    } else if (r.status === 402) {
      reply = 'Kein aktives Abo, Sir.';
      setTimeout(() => { window.location.href = '/#pricing'; }, 1500);
    } else if (r.ok) {
      const ct = r.headers.get('content-type') || '';
      if (ct.includes('text/event-stream')) {
        // Streaming SSE path (chat endpoint).
        bubble = createBotBubble();
        const reader  = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        outer: while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const raw = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const line = raw.split('\n').find(l => l.startsWith('data:'));
            if (!line) continue;
            const json = line.slice(5).trim();
            if (!json) continue;
            let evt;
            try { evt = JSON.parse(json); } catch { continue; }

            if (typeof evt.chunk === 'string') {
              reply += evt.chunk;
              if (bubble) {
                bubble.textContent = reply;
                $messages.scrollTop = $messages.scrollHeight;
              }
            } else if (evt.action) {
              actions.push(evt.action);
            } else if (evt.error) {
              console.error('[askJarvis] stream error:', evt.error);
              if (!reply) reply = evt.reply || 'Tut mir leid, Sir.';
            } else if (evt.done) {
              if (!reply && evt.reply) reply = evt.reply;
              // Once streaming is finished, scan the bubble for ``` code
              // blocks and convert them into interactive run-able panels.
              if (bubble) renderCodeBlocks(bubble, reply);
              break outer;
            }
          }
        }
      } else {
        // JSON fallback (debate endpoint, or any non-streaming response).
        const j = await r.json();
        reply  = (j.reply || '').trim();
        debate = j.debate || null;
        actions = j.actions || [];
      }
    } else {
      console.error('[askJarvis] server error', r.status);
      reply = 'Tut mir leid, Sir — der Server hat ein Problem (' + r.status + ').';
    }

    for (const a of actions) {
      if (a.type === 'map' && a.city)  openMap(a.city);
      if (a.type === 'chat')           openChat();
      if (a.type === 'local_command')  handleLocalCommand(a);
    }
  } catch (e) {
    console.error('[askJarvis] request failed:', e);
    reply = e.name === 'AbortError'
      ? 'Der Server antwortet nicht, Sir. Bitte gleich nochmal probieren.'
      : 'Verbindung zum Server fehlgeschlagen, Sir.';
  } finally {
    _chatPending = false;
    $chatInput.disabled = false;
  }

  if (!reply) reply = 'Verstanden, Sir.';
  // If we never created a streaming bubble (debate or error path), surface
  // the reply as a normal message now.
  if (!bubble) {
    addMessage('bot', reply);
    // Best-effort: turn any ``` blocks into runnable code panels here too.
    const last = $messages.lastElementChild;
    if (last && last.classList.contains('msg')) renderCodeBlocks(last, reply);
  } else if (bubble.textContent !== reply) {
    bubble.textContent = reply;
    renderCodeBlocks(bubble, reply);
  }

  _chatHistory.push({ role: 'assistant', content: reply });
  rememberUrlsFrom(reply);
  if (debate) renderDebatePanel(debate);
  setMode('speaking', 'SPEAKING');
  await speak(reply);
  setMode('idle', 'STANDBY');
}

// Execute a local_command action on the Electron app via the WebSocket
// bridge. Server marks these actions as "Mac-only" — we run them here
// because the server can't reach the user's machine on Vercel.
async function handleLocalCommand(a) {
  if (!a.action) return;
  if (!desktop.isConnected()) {
    addMessage('bot', '⚠️ Diese Funktion benötigt die JARVIS Desktop-App. Bitte starte die App auf deinem Mac.');
    return;
  }
  try {
    const result = await desktop.send(a.action, a.payload || {});
    // Data-returning actions: surface the result inline.
    if (a.action === 'take_screenshot' && result?.png_base64) {
      const img = document.createElement('img');
      img.src = 'data:image/png;base64,' + result.png_base64;
      img.style.cssText = 'max-width:100%;border-radius:6px;border:1px solid rgba(0,220,255,0.2);margin-top:6px;';
      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      wrap.appendChild(img);
      $messages.appendChild(wrap);
      $messages.scrollTop = $messages.scrollHeight;
    } else if (a.action === 'get_clipboard') {
      addMessage('bot', '📋 Clipboard: ' + (result?.text || '(leer)'));
    } else if (a.action === 'run_shell' && result?.output) {
      const out = String(result.output).slice(0, 600);
      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      wrap.style.cssText = 'font-family:JetBrains Mono,Menlo,monospace;font-size:11px;white-space:pre-wrap;background:rgba(0,30,40,0.5);';
      wrap.textContent = out;
      $messages.appendChild(wrap);
      $messages.scrollTop = $messages.scrollHeight;
    }
    // Fire-and-forget actions (open_app, open_url, open_file, set_clipboard)
    // get no inline echo — Claude's text reply already confirmed.
  } catch (e) {
    console.error('[local_command]', a.action, e);
    addMessage('bot', `⚠️ Befehl "${a.action}" fehlgeschlagen: ${e.message}`);
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ── Code blocks with run button ────────────────────────────────────────
// Scans assistant text for ```lang\n...\n``` fences, replaces the chat
// bubble's contents with a mix of paragraphs + interactive code panels.
// "▶ Ausführen" sends to /api/brain/execute (Piston sandbox).
const RUNNABLE_LANGS = new Set([
  'python','py','python3','javascript','js','node','bash','sh','shell',
  'ts','typescript',
]);

function renderCodeBlocks(bubbleEl, fullText) {
  // Only re-render if at least one fence is present, otherwise leave the
  // already-streamed text alone (saves a flicker on plain replies).
  if (!/```/.test(fullText)) return;

  const parts = [];
  const re = /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;
  let lastIdx = 0;
  let m;
  while ((m = re.exec(fullText)) !== null) {
    if (m.index > lastIdx) {
      parts.push({ type: 'text', text: fullText.slice(lastIdx, m.index) });
    }
    parts.push({
      type: 'code',
      lang: (m[1] || '').toLowerCase().trim(),
      code: m[2].replace(/\n+$/, ''),
    });
    lastIdx = m.index + m[0].length;
  }
  if (lastIdx < fullText.length) {
    parts.push({ type: 'text', text: fullText.slice(lastIdx) });
  }
  if (!parts.some(p => p.type === 'code')) return;

  bubbleEl.innerHTML = '';
  for (const p of parts) {
    if (p.type === 'text') {
      const trimmed = p.text.replace(/^\n+|\n+$/g, '');
      if (!trimmed) continue;
      const span = document.createElement('div');
      span.className = 'msg-text';
      span.textContent = trimmed;
      bubbleEl.appendChild(span);
    } else {
      bubbleEl.appendChild(buildCodePanel(p.lang, p.code));
    }
  }
}

function buildCodePanel(lang, code) {
  const panel = document.createElement('div');
  panel.className = 'code-panel';
  const isRunnable = RUNNABLE_LANGS.has(lang);

  const header = document.createElement('div');
  header.className = 'code-head';
  header.innerHTML = `
    <span class="lang">${escapeHtml(lang || 'text')}</span>
    <div class="code-actions"></div>
  `;
  const actions = header.querySelector('.code-actions');

  const copyBtn = document.createElement('button');
  copyBtn.className = 'code-btn';
  copyBtn.textContent = 'Kopieren';
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(code);
      copyBtn.textContent = 'Kopiert ✓';
      setTimeout(() => { copyBtn.textContent = 'Kopieren'; }, 1500);
    } catch (e) {
      copyBtn.textContent = 'Fehler';
    }
  });
  actions.appendChild(copyBtn);

  let runBtn = null;
  if (isRunnable) {
    runBtn = document.createElement('button');
    runBtn.className = 'code-btn run';
    runBtn.textContent = '▶ Ausführen';
    actions.appendChild(runBtn);
  }

  const pre = document.createElement('pre');
  pre.className = 'code-body';
  pre.textContent = code;

  const out = document.createElement('div');
  out.className = 'code-output';
  out.style.display = 'none';

  panel.appendChild(header);
  panel.appendChild(pre);
  panel.appendChild(out);

  if (runBtn) {
    runBtn.addEventListener('click', async () => {
      if (runBtn.disabled) return;
      runBtn.disabled = true;
      const origLabel = runBtn.textContent;
      runBtn.textContent = '⏳ Läuft…';
      out.style.display = 'block';
      out.className = 'code-output running';
      out.textContent = '…';
      try {
        const r = await fetch('/api/brain/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: lang, code }),
        });
        const j = await r.json();
        if (!r.ok) {
          out.className = 'code-output err';
          out.textContent = '⚠ ' + (j.error || `HTTP ${r.status}`);
        } else {
          const stdout = (j.stdout || '').trimEnd();
          const stderr = (j.stderr || '').trimEnd();
          const exit   = (j.exit_code === null || j.exit_code === undefined) ? '?' : j.exit_code;
          let body = '';
          if (stdout) body += stdout;
          if (stderr) body += (body ? '\n\n' : '') + '[stderr]\n' + stderr;
          if (!body) body = '(kein Output)';
          out.className = 'code-output ' + (j.success ? 'ok' : 'err');
          out.textContent = body + `\n\n[exit ${exit} · ${j.language || lang} ${j.version || ''}]`;
        }
      } catch (e) {
        out.className = 'code-output err';
        out.textContent = '⚠ Netzwerkfehler: ' + e.message;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = origLabel;
      }
    });
  }

  return panel;
}

// ── TTS — sentence-pipelined ────────────────────────────────────────────
// Splits the reply on sentence boundaries and fires TTS for each chunk
// in PARALLEL. First chunk starts playing as soon as it's back (~500–700ms),
// not after the full reply is rendered to audio. Subsequent chunks queue
// behind in order. Resolves when the LAST chunk finishes playing.

let _currentAudio = null;
let _audioQueueCancel = null;

function splitSentences(text) {
  if (!text) return [];
  // Split at sentence terminators while keeping punctuation. Avoid splitting
  // on common abbreviations (Sir., Dr., e.g., z.B.).
  const cleaned = text.replace(/\b(Sir|Dr|Mr|Mrs|Ms|St|z\s?B|e\s?g|i\s?e)\.\s/gi, '$1<DOT> ');
  const parts = cleaned.split(/(?<=[.!?…])\s+(?=[A-ZÄÖÜ])/);
  return parts.map(s => s.replace(/<DOT>/g, '.').trim()).filter(Boolean);
}

async function fetchTtsBlob(text) {
  const r = await fetch('/api/brain/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  });
  if (!r.ok) throw new Error('TTS ' + r.status);
  return await r.blob();
}

function speak(fullText) {
  return new Promise(async (resolve) => {
    // Cancel any previous queue
    try { _currentAudio?.pause(); } catch {}
    if (_audioQueueCancel) { _audioQueueCancel(); }
    let cancelled = false;
    _audioQueueCancel = () => { cancelled = true; };

    const sentences = splitSentences(fullText);
    if (sentences.length === 0) return resolve();

    // Fire ALL TTS requests in parallel
    const blobPromises = sentences.map(s => fetchTtsBlob(s).catch(() => null));

    // Play them in order — each waits for its own blob, plays, then next
    for (let i = 0; i < blobPromises.length; i++) {
      if (cancelled) break;
      let blob;
      try { blob = await blobPromises[i]; } catch { blob = null; }
      if (!blob) continue;
      if (cancelled) break;
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      _currentAudio = audio;
      await new Promise((res) => {
        const done = () => { URL.revokeObjectURL(url); res(); };
        audio.onended = done;
        audio.onerror = done;
        audio.play().catch(done);
      });
    }
    _audioQueueCancel = null;
    if (!cancelled) resolve();
  });
}


// ── Desktop bridge (WebSocket → local Electron app on ws://127.0.0.1:7777) ──
// Lets us proxy Mac-level actions (open_app / shell / screenshot / clipboard)
// into the user's local JARVIS app. When connected, server-emitted
// `local_command` actions in chat responses are forwarded here.
const desktop = (() => {
  const URL_LOCAL = 'ws://127.0.0.1:7777';
  let socket = null;
  let state  = 'disconnected';   // 'disconnected' | 'connecting' | 'connected'
  let actions = [];               // list reported by the bridge in its hello frame
  let reconnectDelay = 1000;      // exponential backoff, capped
  let reconnectTimer = null;
  const pending = new Map();      // id → { resolve, reject, timeout }
  let nextId = 1;

  const $badge      = document.getElementById('desktop-badge');
  const $badgeText  = document.getElementById('desktop-badge-text');
  const $modal      = document.getElementById('desktop-modal');
  const $modalTitle = document.getElementById('desktop-modal-title');
  const $modalBody  = document.getElementById('desktop-modal-body');
  const $modalList  = document.getElementById('desktop-feature-list');
  const $modalDl    = document.getElementById('desktop-modal-download');

  document.body.classList.add('has-desktop-badge');

  function setState(s) {
    state = s;
    $badge.classList.remove('connected', 'connecting', 'disconnected');
    $badge.classList.add(s);
    $badgeText.textContent =
      s === 'connected'  ? 'Desktop verbunden' :
      s === 'connecting' ? 'Verbinde…'         :
                           'Nur Browser-Modus';
  }

  function connect() {
    if (socket && socket.readyState <= 1) return;  // CONNECTING or OPEN
    setState('connecting');
    let s;
    try {
      s = new WebSocket(URL_LOCAL);
    } catch (e) {
      console.warn('[desktop] WebSocket constructor failed:', e?.message);
      scheduleReconnect();
      return;
    }
    socket = s;

    s.onopen = () => {
      console.log('[desktop] connected to bridge');
      reconnectDelay = 1000;
    };
    s.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'hello') {
        actions = Array.isArray(msg.actions) ? msg.actions : [];
        setState('connected');
        return;
      }
      // Response to a sent action.
      if (msg.id && pending.has(msg.id)) {
        const { resolve, reject, timeout } = pending.get(msg.id);
        clearTimeout(timeout);
        pending.delete(msg.id);
        if (msg.ok) resolve(msg.result || {}); else reject(new Error(msg.error || 'bridge error'));
      }
    };
    s.onclose = (ev) => {
      console.warn('[desktop] bridge closed:', ev.code, ev.reason);
      socket = null;
      setState('disconnected');
      // Reject any pending requests so callers get unblocked.
      for (const { reject, timeout } of pending.values()) {
        clearTimeout(timeout);
        reject(new Error('bridge disconnected'));
      }
      pending.clear();
      scheduleReconnect();
    };
    s.onerror = () => { /* onclose handles the user-facing side */ };
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30_000);
  }

  function isConnected() { return state === 'connected'; }

  // send(action, payload) — resolves with result, rejects on bridge error/timeout.
  function send(action, payload, { timeoutMs = 10_000 } = {}) {
    return new Promise((resolve, reject) => {
      if (!isConnected() || !socket) {
        reject(new Error('desktop bridge not connected'));
        return;
      }
      const id = String(nextId++);
      const timeout = setTimeout(() => {
        if (pending.has(id)) {
          pending.delete(id);
          reject(new Error(`bridge action "${action}" timed out`));
        }
      }, timeoutMs);
      pending.set(id, { resolve, reject, timeout });
      try {
        socket.send(JSON.stringify({ id, action, payload: payload || null }));
      } catch (e) {
        clearTimeout(timeout);
        pending.delete(id);
        reject(e);
      }
    });
  }

  // Click badge → modal with capabilities.
  $badge.addEventListener('click', () => {
    const connected = isConnected();
    $modalTitle.textContent = connected ? 'Desktop verbunden' : 'Nur Browser-Modus';
    $modalBody.textContent  = connected
      ? 'Die JARVIS Desktop-App ist verbunden. Folgende Mac-Aktionen stehen JARVIS zur Verfügung:'
      : 'Die JARVIS Desktop-App ist nicht erreichbar. JARVIS kann im Browser sprechen und denken, aber keine Mac-Aktionen ausführen. Starte die App auf deinem Mac und versuche es erneut.';
    const all = ['open_app','open_url','open_file','run_shell','take_screenshot','get_clipboard','set_clipboard'];
    $modalList.innerHTML = '';
    for (const a of all) {
      const li = document.createElement('li');
      const ok = connected && actions.includes(a);
      li.innerHTML = `<span class="ic ${ok ? 'on' : 'off'}">${ok ? '✓' : '✗'}</span>${a}`;
      $modalList.appendChild(li);
    }
    $modalDl.style.display = connected ? 'none' : 'block';
    $modal.classList.add('open');
  });

  document.getElementById('desktop-modal-close').addEventListener('click', () => {
    $modal.classList.remove('open');
  });
  $modal.addEventListener('click', (e) => {
    if (e.target === $modal) $modal.classList.remove('open');
  });

  // Start the connection attempt.
  setState('disconnected');
  connect();

  return { isConnected, send };
})();


// ── Hand-tracking via MediaPipe Hands (CDN, lazy-loaded) ──────────────
// Toggle with the ✋ HAND pill. When active a small mirrored webcam
// preview shows top-left with landmark dots painted on. Gestures map:
//   ✋ open hand  → stop everything (cancel TTS, stop voice loop)
//   ✊ fist        → trigger send / start voice if off
//   ☝ index up   → activate voice (start listening)
//   ← swipe left → close chat pane
//   → swipe right→ open chat pane
const $handBtn    = document.getElementById('hand-btn');
const $handCam    = document.getElementById('hand-cam');
const $handVideo  = document.getElementById('hand-video');
const $handCanvas = document.getElementById('hand-canvas');
const $handLabel  = document.getElementById('hand-label');

let _handsActive       = false;
let _handsSolution     = null;     // MediaPipe Hands instance
let _handCamera        = null;     // MediaPipe Camera helper
let _lastGestureAt     = 0;
const HAND_COOLDOWN_MS = 1500;
const _swipeHistory    = [];       // {t, x} of palm position

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[data-src="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src; s.dataset.src = src; s.crossOrigin = 'anonymous';
    s.onload = resolve;
    s.onerror = () => reject(new Error('failed to load ' + src));
    document.head.appendChild(s);
  });
}

async function loadMediaPipeHands() {
  if (window.Hands && window.Camera) return;
  // Pinned versions — newer @mediapipe/hands releases sometimes break the
  // browser-script shape. These two together are known good.
  await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js');
  await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466124/camera_utils.js');
}

// Returns true if the tip is further from the wrist than the proximal-
// interphalangeal joint — a cheap "finger extended" test.
function fingerExtended(lm, tipIdx, pipIdx, mul = 1.05) {
  const w = lm[0];
  const tip = lm[tipIdx], pip = lm[pipIdx];
  const dTip = Math.hypot(tip.x - w.x, tip.y - w.y);
  const dPip = Math.hypot(pip.x - w.x, pip.y - w.y);
  return dTip > dPip * mul;
}

function classifyGesture(lm) {
  const thumb  = fingerExtended(lm, 4,  2, 1.0);
  const index  = fingerExtended(lm, 8,  6, 1.10);
  const middle = fingerExtended(lm, 12, 10, 1.10);
  const ring   = fingerExtended(lm, 16, 14, 1.10);
  const pinky  = fingerExtended(lm, 20, 18, 1.10);
  const ext = [thumb, index, middle, ring, pinky];
  const n = ext.filter(Boolean).length;

  if (n >= 4)                                       return { kind: 'open',  label: '✋ OFFEN' };
  if (n <= 1 && !index && !middle && !ring && !pinky) return { kind: 'fist',  label: '✊ FAUST' };
  if (index && !middle && !ring && !pinky)          return { kind: 'index', label: '☝ INDEX' };
  return { kind: 'unknown', label: 'GESTE ?' };
}

function flashHandCam() {
  $handCam.classList.remove('fired');
  void $handCam.offsetWidth;
  $handCam.classList.add('fired');
}

function fireGesture(kind) {
  _lastGestureAt = performance.now();
  flashHandCam();
  console.log('[hand] →', kind);
  switch (kind) {
    case 'open':
      // Stop everything
      try { _audioQueueCancel?.(); } catch {}
      try { stopRecog(); } catch {}
      $handLabel.textContent = '✋ STOP';
      break;
    case 'fist':
      // Confirm — submit chat input if there's text, else start voice
      try {
        const v = $chatInput.value.trim();
        if (v) { $chatInput.value = ''; askJarvis(v); }
        else if (!_voiceLoopActive) startRecog();
      } catch {}
      $handLabel.textContent = '✊ BESTÄTIGT';
      break;
    case 'index':
      // Activate JARVIS
      try { if (!_voiceLoopActive) startRecog(); } catch {}
      $handLabel.textContent = '☝ JARVIS AN';
      break;
    case 'swipe-left':
      try { closeChat(); } catch {}
      $handLabel.textContent = '← CHAT ZU';
      break;
    case 'swipe-right':
      try { openChat(); } catch {}
      $handLabel.textContent = '→ CHAT AUF';
      break;
  }
}

function handleHandResults(results) {
  const ctx = $handCanvas.getContext('2d');
  $handCanvas.width  = $handVideo.videoWidth  || 320;
  $handCanvas.height = $handVideo.videoHeight || 240;
  ctx.clearRect(0, 0, $handCanvas.width, $handCanvas.height);

  if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
    $handLabel.textContent = '—';
    _swipeHistory.length = 0;
    return;
  }

  const lm = results.multiHandLandmarks[0];

  // Paint landmarks (cyan dots) and a thin skeleton (a few key bones).
  ctx.fillStyle = 'rgba(34, 211, 238, 0.9)';
  for (const p of lm) {
    ctx.beginPath();
    ctx.arc(p.x * $handCanvas.width, p.y * $handCanvas.height, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(34, 211, 238, 0.55)';
  ctx.lineWidth = 1.2;
  const bones = [[0,5],[5,9],[9,13],[13,17],[0,17],[0,1],[1,2],[2,3],[3,4],
                 [5,6],[6,7],[7,8],[9,10],[10,11],[11,12],
                 [13,14],[14,15],[15,16],[17,18],[18,19],[19,20]];
  for (const [a, b] of bones) {
    ctx.beginPath();
    ctx.moveTo(lm[a].x * $handCanvas.width, lm[a].y * $handCanvas.height);
    ctx.lineTo(lm[b].x * $handCanvas.width, lm[b].y * $handCanvas.height);
    ctx.stroke();
  }

  const g = classifyGesture(lm);
  $handLabel.textContent = g.label;

  // Track palm x for swipe detection (lm[0] = wrist).
  const now = performance.now();
  _swipeHistory.push({ t: now, x: lm[0].x });
  while (_swipeHistory.length && now - _swipeHistory[0].t > 600) _swipeHistory.shift();

  if (now - _lastGestureAt < HAND_COOLDOWN_MS) return;

  // Swipe wins over static gestures if we see a fast horizontal move.
  if (_swipeHistory.length >= 8) {
    const first = _swipeHistory[0], last = _swipeHistory[_swipeHistory.length - 1];
    const dx = last.x - first.x;
    const dt = last.t - first.t;
    if (Math.abs(dx) > 0.25 && dt < 550) {
      // Video is mirrored on screen — so dx > 0 in landmark space (which
      // is NOT mirrored) means the hand went left in the user's view.
      fireGesture(dx > 0 ? 'swipe-left' : 'swipe-right');
      _swipeHistory.length = 0;
      return;
    }
  }

  if (g.kind === 'open' || g.kind === 'fist' || g.kind === 'index') {
    fireGesture(g.kind);
  }
}

async function startHandTracking() {
  if (_handsActive) return;
  $handBtn.textContent = '✋ LÄDT…';
  try {
    await loadMediaPipeHands();

// ── Speech-to-text via MediaRecorder + /api/brain/transcribe (Whisper) ──
// Records audio between speech and silence using a simple RMS-based VAD,
// posts each utterance to the server for transcription. Falls back to the
// browser's SpeechRecognition if microphone access fails.

const $micBtn = document.getElementById('mic-btn');
let _stream = null, _ctx = null, _analyser = null, _recorder = null;
let _chunks = [], _mime = 'audio/webm';
let _voiceLoopActive = false;

async function startRecog() {
  if (_voiceLoopActive) return;
  try {
    _stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    console.error('[startRecog] mic permission denied:', e?.name, e?.message);
    setMode('idle', 'MIC PERMISSION DENIED');
    return;
  }
  _voiceLoopActive = true;
  window._wantsVoice = true;
  $micBtn.textContent = '◉ VOICE ON';
  $micBtn.classList.add('recording');
  loop();
}

// Garbage transcripts we get when the mic picks up nothing useful — we
// drop these instead of sending them to Claude (otherwise Claude treats
// stale conversational state as if the user repeated a command).
const JUNK_TRANSCRIPTS = new Set([
  '', '.', 'thank you.', 'thanks.', 'thank you', 'thanks',
  'you', 'you.', 'okay.', 'okay', 'ok.', 'ok', 'mhm', 'hmm', 'uhm',
  'yeah', 'yeah.', 'ja.', 'ja', 'mm.', 'mm',
  'untertitelung des zdf für funk', 'untertitel im auftrag des zdf',
]);

function isJunkTranscript(t) {
  const s = t.toLowerCase().trim();
  if (s.length < 3) return true;
  if (JUNK_TRANSCRIPTS.has(s)) return true;
  // Mostly punctuation/single sounds
  if (/^[\s.,!?'"-]+$/.test(s)) return true;
  return false;
}

// Per-listen threshold below which we ignore a Groq Whisper transcript —
// stops the model running on background-radio / fans / TV chatter.
const MIN_CONFIDENCE = 0.6;
// Sleep between JARVIS finishing his answer and the next listen pass.
// Prevents JARVIS's own TTS or a half-second of room echo getting picked up.
const RESPONSE_COOLDOWN_MS = 1500;

async function loop() {
  while (window._wantsVoice) {
    try {
      const r = await listenOnce();
      if (!window._wantsVoice) break;
      if (!r) continue;
      const { text, confidence } = r;
      if (text.length < 3) {
        console.log('[STT] dropping short:', JSON.stringify(text));
        continue;
      }
      if (confidence < MIN_CONFIDENCE) {
        console.log(`[STT] low confidence ${confidence.toFixed(2)} — dropping "${text}"`);
        continue;
      }
      if (isJunkTranscript(text)) {
        console.log('[STT] dropping junk:', text);
        continue;
      }
      try {
        await handleCommand(text);
      } catch (e) {
        console.error('[handleCommand crashed]', e);
      }
      // Cooldown after JARVIS finishes responding so his own voice + room
      // echo don't immediately re-trigger the loop.
      if (window._wantsVoice) {
        setMode('idle', 'COOLDOWN');
        await new Promise(rs => setTimeout(rs, RESPONSE_COOLDOWN_MS));
      }
    } catch (e) {
      console.error('[listenOnce crashed]', e);
      await new Promise(r => setTimeout(r, 500));
    }
    setMode('idle', 'STANDBY');
  }
  stopAll();
}

function stopAll() {
  _voiceLoopActive = false;
  try { _recorder?.stop(); } catch (e) { console.warn('[stopAll] recorder:', e?.message); }
  try { _ctx?.close(); }     catch (e) { console.warn('[stopAll] ctx:', e?.message); }
  _stream?.getTracks().forEach(t => t.stop());
  _stream = _ctx = _analyser = _recorder = null;
  setMode('idle', 'STANDBY');
  $micBtn.textContent = '◉ ENABLE VOICE';
  $micBtn.classList.remove('recording');
}

// listenOnce resolves with { text, confidence, durationMs } on a real
// speech sample, or null when the user was silent / aborted.
// The VAD is tighter than before: higher noise-floor multiplier, a
// consecutive-frames gate so a single mic pop can't start "speech",
// and a 500 ms minimum total speech duration before we even bother
// hitting Whisper.
function listenOnce() {
  return new Promise((resolve) => {
    setMode('listening', 'LISTENING');
    _ctx = new AudioContext();
    const src = _ctx.createMediaStreamSource(_stream);
    _analyser = _ctx.createAnalyser();
    _analyser.fftSize = 1024;
    src.connect(_analyser);
    const buf = new Uint8Array(_analyser.frequencyBinCount);

    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']
      .find(m => MediaRecorder.isTypeSupported(m)) || 'audio/webm';
    _mime = mime;
    _recorder = new MediaRecorder(_stream, { mimeType: mime });
    _chunks = [];
    _recorder.ondataavailable = (e) => { if (e.data.size > 0) _chunks.push(e.data); };
    _recorder.start(80);

    // VAD constants. Threshold = max(MIN_THR, noise_floor * 4); single loud
    // frames don't count — we need CONSEC_FRAMES_TO_START consecutive
    // frames above threshold before declaring "speech started". Total
    // speech-frame count must be ≥ MIN_SPEECH_FRAMES (about 500 ms) before
    // we'll send to Whisper.
    const SILENCE_HANG          = 1500;
    const MAX_LISTEN            = 20000;
    const MIN_SPEECH            = 220;
    const CALIBRATE             = 400;
    const MIN_THR               = 0.025;   // raised from 0.012 — drops fans/aircon
    const MAX_THR               = 0.08;    // raised from 0.05 — works in louder rooms
    const NOISE_MULTIPLIER      = 4;       // raised from 3 — more headroom over floor
    const CONSEC_FRAMES_TO_START = 5;      // ~80 ms of continuous loudness
    const MIN_SPEECH_FRAMES     = 30;      // ~500 ms total speech before we accept

    let speechStart   = 0, lastLoud = 0, ever = false;
    let noise         = 0, calFrames = 0, thr = MAX_THR;
    let consecLoud    = 0;
    let speechFrames  = 0;
    const started     = performance.now();

    function tick() {
      if (!window._wantsVoice) return resolve(null);
      _analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = (buf[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / buf.length);
      const now = performance.now();
      const el = now - started;

      if (el < CALIBRATE) {
        noise = (noise * calFrames + rms) / (calFrames + 1);
        calFrames++;
        if (el >= CALIBRATE - 16) {
          thr = Math.min(MAX_THR, Math.max(MIN_THR, noise * NOISE_MULTIPLIER));
          console.log(`[VAD] noise=${noise.toFixed(4)} thr=${thr.toFixed(4)}`);
        }
      }

      if (rms >= thr) {
        consecLoud++;
        if (!ever && consecLoud >= CONSEC_FRAMES_TO_START) {
          ever = true;
          speechStart = now - consecLoud * 16;  // back-date to where loudness started
        }
        if (ever) { lastLoud = now; speechFrames++; }
      } else {
        consecLoud = 0;
      }

      if (ever && (now - lastLoud) > SILENCE_HANG && (now - speechStart) > MIN_SPEECH) {
        return finish(true);
      }
      if (!ever && el > MAX_LISTEN) return finish(false);
      requestAnimationFrame(tick);
    }

    function finish(didSpeak) {
      const speechDurationMs = ever ? (lastLoud - speechStart) : 0;
      try { _ctx?.close(); } catch {}
      _ctx = _analyser = null;
      if (!_recorder || _recorder.state === 'inactive') return resolve(null);
      _recorder.onstop = async () => {
        if (!didSpeak || !_chunks.length) return resolve(null);
        // Hard floor: too little actual speech → drop without paying for STT.
        if (speechFrames < MIN_SPEECH_FRAMES) {
          console.log(`[VAD] speech too short (${speechFrames} frames, ~${(speechFrames * 16) | 0}ms) — dropping`);
          return resolve(null);
        }
        const blob = new Blob(_chunks, { type: _mime });
        setMode('thinking', 'TRANSCRIBING');
        try {
          const fd = new FormData();
          fd.append('audio', blob, 'audio.webm');
          const r = await fetch('/api/brain/transcribe', { method: 'POST', body: fd });
          if (!r.ok) return resolve(null);
          const j = await r.json();
          const text = (j.text || '').trim();
          const confidence = typeof j.confidence === 'number' ? j.confidence : 1;
          console.log(`[STT] "${text}" (conf=${confidence.toFixed(2)}, ${j.provider || '?'})`);
          if (!text) return resolve(null);
          resolve({ text, confidence, durationMs: speechDurationMs });
        } catch (e) {
          console.warn('[STT] transcribe failed:', e.message);
          resolve(null);
        }
      };
      _recorder.stop();
    }

    requestAnimationFrame(tick);
  });
}

function stopRecog() {
  window._wantsVoice = false;
  stopAll();
}

$micBtn.addEventListener('click', () => {
  if (_voiceLoopActive) stopRecog(); else startRecog();
});
